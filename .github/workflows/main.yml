name: main

on:
  push:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/*.sh"
      - ".github/workflows/main.yml"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/*.sh"
      - ".github/workflows/main.yml"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check flake and prepare matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: &nix-extra-conf |
            experimental-features = nix-command flakes
            trusted-users = runner
            fallback = true
            builders-use-substitutes = true
            connect-timeout = 5
            http-connections = 64
            max-substitution-jobs = 64
            extra-substituters = https://nix-cache.sped0n.com/nix-cache?priority=30
            extra-trusted-public-keys = nix-cache.sped0n.com-1:2QjPOhbTs8xHYPpe0tuGIQQ+DFmEZMv05UAfHzU9Crg=

      - name: Run prek checks
        run: |
          nix shell --inputs-from . nixpkgs#prek nixpkgs#nixfmt nixpkgs#actionlint \
            -c prek run --all-files

      - name: Read version matrix
        id: matrix
        run: |
          packages=$(nix eval --json .#lib.chipVersions | jq -c 'map({name: ("chip-host-tools_" + gsub("\\."; "_")), version: .})')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Check flake
        run: nix flake check --no-build --all-systems

  host-tools:
    name: build ${{ matrix.package.name }} (${{ matrix.target.system }})
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    env:
      CCACHE_DIR: /nix/var/cache/ccache
      CCACHE_MAX_SIZE: 200M
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: *nix-extra-conf

      - name: Restore ccache
        id: ccache-restore
        uses: ./.github/actions/restore-ccache
        with:
          directory: ${{ env.CCACHE_DIR }}
          max-size: ${{ env.CCACHE_MAX_SIZE }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-${{ hashFiles(format('packages/chip-sdk/versions/{0}.nix', matrix.package.version), 'packages/chip-sdk/build.nix', 'packages/chip-host-tools/default.nix', 'packages/zap-cli-bin/**/*.nix', 'flake.nix', 'flake.lock') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools
        run: nix profile add --inputs-from . nixpkgs#ccache

      - name: Add Nix profile binaries to PATH
        run: echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Reset ccache stats
        run: |
          set -euo pipefail
          sudo --preserve-env=CCACHE_DIR "$(command -v ccache)" -z

      - name: Build package
        id: package
        run: |
          paths="$({
            nix build -L --print-out-paths --cores 2 --max-jobs 1 --option extra-sandbox-paths "$CCACHE_DIR" \
              ".#packages.${{ matrix.target.system }}.${{ matrix.package.name }}"
          } | sort -u)"
          printf '%s\n' "$paths"
          printf 'paths<<EOF\n%s\nEOF\n' "$paths" >> "$GITHUB_OUTPUT"

      - name: Publish package to Nix cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: ./.github/actions/push-nix-cache
        with:
          paths: ${{ steps.package.outputs.paths }}
        env:
          NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      - name: Show ccache stats
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sudo --preserve-env=CCACHE_DIR,CCACHE_MAX_SIZE "$(command -v ccache)" -M "$CCACHE_MAX_SIZE"
          sudo --preserve-env=CCACHE_DIR "$(command -v ccache)" -c
          sudo --preserve-env=CCACHE_DIR "$(command -v ccache)" -svv

      - name: Save ccache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ccache
        with:
          directory: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  image:
    needs: prepare
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            fallback = true
            extra-substituters = https://nix-cache.sped0n.com/nix-cache?priority=30
            extra-trusted-public-keys = nix-cache.sped0n.com-1:2QjPOhbTs8xHYPpe0tuGIQQ+DFmEZMv05UAfHzU9Crg=
            extra-sandbox-paths = /nix/var/cache/ccache

      - name: Restore compiler cache
        id: ccache-restore
        uses: ./.github/actions/restore-ccache
        with:
          max-size: 1G
          key: ccache-image-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-keys: ccache-image-${{ runner.arch }}-

      - name: Build image and controller
        id: image
        run: |
          nix build -L .#docker-image --out-link image --cores 4 --max-jobs 1
          nix build -L .#chip-host-tools --out-link host-tools --cores 4 --max-jobs 1
          image_name=$(nix eval --raw .#docker-image.imageName)
          image_tag=$(nix eval --raw .#docker-image.imageTag)
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          docker load -i image
          archive_size=$(stat -Lc %s image)
          unpacked_size=$(docker image inspect "$image_name:$image_tag" --format '{{.Size}}')
          {
            echo "### Image size (${{ matrix.arch }})"
            echo "- Gzip archive: $(numfmt --to=iec-i --suffix=B "$archive_size")"
            echo "- Unpacked layers: $(numfmt --to=iec-i --suffix=B "$unpacked_size")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare controller discovery and IPv6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0 net.ipv6.conf.default.disable_ipv6=0
          sudo systemctl start avahi-daemon

      - name: Check runtime, commissioning, and persistence
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          export CHIP_TOOL="$PWD/host-tools/bin/chip-tool"
          export CHIP_SOURCE
          CHIP_SOURCE=$(nix build --no-link --print-out-paths .#chip-host-tools.src)
          bash .github/workflows/check-image.sh "$IMAGE"

      - name: Collect example cache paths
        id: example-cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        run: |
          package_names=$(nix eval --json --file packages/chip-examples/apps.nix \
            --apply 'apps: builtins.attrNames apps ++ [ "chip-examples" ]' | jq -r '.[]')
          installables=()
          while IFS= read -r package; do
            installables+=(".#packages.${{ matrix.system }}.$package")
          done <<< "$package_names"
          paths=$(nix build --no-link --print-out-paths "${installables[@]}" | sort -u)
          printf 'paths<<EOF\n%s\nEOF\n' "$paths" >> "$GITHUB_OUTPUT"

      - name: Publish examples to Nix cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: ./.github/actions/push-nix-cache
        with:
          paths: ${{ steps.example-cache.outputs.paths }}
        env:
          NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      - name: Prepare checked image artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          cp -L image image.tar.gz
          printf '%s\n' "$IMAGE_TAG" > tag.txt

      - name: Upload checked image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: |
            image.tar.gz
            tag.txt
          compression-level: 0
          retention-days: 1

      - name: Save compiler cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ccache
        with:
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  prune-caches:
    needs: [host-tools, image]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prune superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/prune-caches.sh

  publish-image:
    needs: image
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download checked images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          path: images

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish checked images and multi-platform tags
        run: |
          nix shell --inputs-from . nixpkgs#crane -c bash .github/workflows/publish-image.sh \
            ghcr.io/sped0n/chipmunk images
