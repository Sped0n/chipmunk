name: Save ccache
description: Copy the compiler cache into a runner-owned snapshot and save it.

inputs:
  key:
    description: Primary cache key returned by restore-ccache.
    required: true
  directory:
    description: Compiler cache directory shared with Nix builds.
    default: /nix/var/cache/ccache

runs:
  using: composite
  steps:
    - name: Prepare compiler cache snapshot
      shell: bash
      env:
        CCACHE_DIR: ${{ inputs.directory }}
        CCACHE_STAGING_DIR: ${{ runner.temp }}/ccache
      run: |
        set -euo pipefail

        rm -rf "$CCACHE_STAGING_DIR"
        mkdir -p "$CCACHE_STAGING_DIR"
        sudo mkdir -p "$CCACHE_DIR"
        sudo cp -a "$CCACHE_DIR"/. "$CCACHE_STAGING_DIR"/
        sudo rm -rf "$CCACHE_STAGING_DIR"/tmp "$CCACHE_STAGING_DIR"/lock
        sudo chown -R "$(id -un):$(id -gn)" "$CCACHE_STAGING_DIR"
        chmod -R u+rwX,go-rwx "$CCACHE_STAGING_DIR"

    - name: Save compiler cache snapshot
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ inputs.key }}
