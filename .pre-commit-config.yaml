repos:
  - repo: local
    hooks:
      - id: nix-format
        name: Format Nix
        entry: nixfmt
        language: system
        files: '\.nix$'

      - id: actionlint
        name: Check GitHub Actions
        entry: actionlint
        language: system
        files: '^\.github/(workflows/[^/]+|actions/.+/action)\.ya?ml$'
        pass_filenames: false
